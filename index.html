<body class="antialiased min-h-screen">
<div class="flex min-h-screen">
  <aside class="glass m-2 sm:m-3 p-2 sm:p-3 w-14 sm:w-52 shrink-0 sticky top-2 sm:top-3 self-start h-[calc(100vh-1rem)] sm:h-[calc(100vh-1.5rem)] flex flex-col">
    <h1 class="font-bold py-3 text-center sm:text-left sm:px-2 text-sm sm:text-base"><span class="sm:hidden">九九</span><span class="hidden sm:inline">九九れんしゅう</span></h1>
    <nav id="nav" class="flex flex-col gap-1 flex-1" aria-label="メニュー"></nav>
  </aside>
  <main id="app" class="flex-1 min-w-0 w-full max-w-4xl px-3 sm:px-8 py-4 sm:py-8"></main>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const LS = 'kuku-v1';
let db;
try { db = JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { db = {}; }
db.log = db.log || []; db.sessions = db.sessions || []; db.tests = db.tests || []; db.alongs = db.alongs || [];
const save = () => { try { localStorage.setItem(LS, JSON.stringify(db)); } catch (e) {} };
db.ui = Object.assign({ theme: 'system', furi: true, goal: 100 }, db.ui);
const goal = () => Math.min(Math.max(Math.round(+db.ui.goal) || 100, 10), 9999);
const setGoal = v => { db.ui.goal = Math.min(Math.max(Math.round(+v) || goal(), 10), 9999); save(); renderSettings(); };
const greeting = h => h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 18 ? 'Good afternoon' : 'Good evening';
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const t = db.ui.theme, dark = t === 'dark' || (t === 'system' && mq && mq.matches);
  document.documentElement.classList.toggle('dark', dark);
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);
applyTheme();

const MODES = { asc: '順番(上がり)', desc: '順番(下がり)', rand: 'バラ', weak: '苦手モード' };
const MODE_DESC = { asc: '1×1 から 1×9 の順に出題します', desc: '1×9 から 1×1 の順に出題します', rand: '順番をばらばらにして出題します', weak: '過去の間違いや時間のかかった問題を優先して出題します' };
const DIFF = { easy: ['かんたん', '掛ける数が 1〜5'], normal: ['ふつう', '掛ける数が 1〜9 すべて'], hard: ['むずかしい', '掛ける数が 6〜9'] };
const COLORS = ['#334155', '#64748b', '#cbd5e1', '#2563eb', '#93c5fd', '#7c3aed', '#c4b5fd', '#e11d48', '#fda4af'];
const ICON = {
  back: '<svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m13 9 4 6M17 9l-4 6"/></svg>',
  ok: '<svg viewBox="0 0 24 24" class="w-5 h-5 inline" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  ng: '<svg viewBox="0 0 24 24" class="w-5 h-5 inline" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
  prev: '<svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>'
};

const cfg = { mode: 'asc', dans: new Set([1,2,3,4,5,6,7,8,9]), count: 10, diff: 'normal' };
let tab = 'home', quiz = null, sp = { period: 'day', off: 0 };
const learn = { sub: 'table', dans: new Set([1]), sel: null, order: 'asc', run: null };
const setg = { imode: 'merge', msg: null };
const rec = { view: 'main', kind: 'test', sel: null, filter: 'all' };

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const key = (a, b) => a + 'x' + b;
const btn = (on) => on ? 'btn-accent text-white' : 'glass-btn text-slate-700';
const fmtDate = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

/* ---- stats ---- */
const hasLog = () => db.log.some(x => !x.along);
const ALONG_SP = 5;
function stats() {
  const m = {};
  for (const r of db.log) { if (r.along) continue; const k = key(r.a, r.b); (m[k] = m[k] || []).push(r); }
  return m;
}
function weakScore(rs) {
  if (!rs) return 0.5;
  const r = rs.slice(-10), n = r.length;
  const wr = r.filter(x => !x.ok).length / n;
  const avg = r.reduce((s, x) => s + x.ms, 0) / n;
  const slow = Math.min(Math.max((avg - 2500) / 6000, 0), 1);
  return wr * 3 + slow + (n < 3 ? 0.3 : 0);
}
function weakList(dans, n) {
  const st = stats(), out = [];
  for (const a of dans) for (let b = 1; b <= 9; b++) out.push({ a, b, s: weakScore(st[key(a, b)]), seen: !!st[key(a, b)] });
  return shuffle(out).sort((x, y) => y.s - x.s).slice(0, n);
}

/* ---- question building ---- */
function buildQuestions() {
  const dans = [...cfg.dans].sort((a, b) => a - b), q = [];
  if (cfg.mode === 'asc') dans.forEach(a => { for (let b = 1; b <= 9; b++) q.push({ a, b }); });
  else if (cfg.mode === 'desc') dans.forEach(a => { for (let b = 9; b >= 1; b--) q.push({ a, b }); });
  else if (cfg.mode === 'rand') {
    const [lo, hi] = cfg.diff === 'easy' ? [1, 5] : cfg.diff === 'hard' ? [6, 9] : [1, 9];
    let pool = [];
    dans.forEach(a => { for (let b = lo; b <= hi; b++) pool.push({ a, b }); });
    pool = shuffle(pool);
    const n = cfg.count === 'all' ? pool.length : Math.min(cfg.count, pool.length);
    return pool.slice(0, n);
  } else {
    const n = cfg.count === 'all' ? 20 : cfg.count;
    return shuffle(weakList(dans, n).map(({ a, b }) => ({ a, b })));
  }
  return q;
}

/* ---- render: nav ---- */
function renderNav() {
  const P = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    study: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
    learn: '<path d="M12 6c-1.5-1.2-3.5-2-6-2H3v14h3c2.5 0 4.5.8 6 2 1.5-1.2 3.5-2 6-2h3V4h-3c-2.5 0-4.5.8-6 2z"/><path d="M12 6v14"/>',
    test: '<path d="M9 4h6a1 1 0 011 1v1H8V5a1 1 0 011-1z"/><path d="M8 6H6a1 1 0 00-1 1v13a1 1 0 001 1h12a1 1 0 001-1V7a1 1 0 00-1-1h-2"/><path d="m9 14 2 2 4-4"/>',
    records: '<path d="M4 20V10M12 20V4M20 20v-7"/>',
    settings: '<path d="M4 6h8m4 0h4M4 12h2m4 0h10M4 18h10m4 0h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>'
  };
  const items = [['home', 'ホーム'], ['study', '学習'], ['learn', '覚える'], ['test', 'テスト'], ['records', '記録'], ['settings', '設定']];
  $('#nav').innerHTML = items.map(([id, t]) =>
    `<button data-tab="${id}" aria-label="${t}" class="flex items-center gap-3 px-2.5 sm:px-3 py-2.5 rounded-xl text-sm font-medium ${id === 'settings' ? 'mt-auto' : ''} ${tab === id ? 'nav-active' : 'text-slate-600 nav-hover'}" ${tab === id ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[id]}</svg><span class="hidden sm:inline">${t}</span></button>`).join('');
}
$('#nav').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (!t) return;
  const busy = (quiz && !quiz.done) || (test && !test.done);
  if (busy && !confirm(test && !test.done ? 'テストを中断しますか?(結果は保存されません)' : '学習を中断しますか?(ここまでの回答は記録されます)')) return;
  stopTest(); quiz = null; test = null; rec.view = 'main'; rec.sel = null; endAlong(); tab = t.dataset.tab; render();
});

function render() {
  renderNav();
  if (tab === 'home') renderHome();
  else if (tab === 'study') quiz ? (quiz.done ? renderResult() : renderQuiz()) : renderSetup();
  else if (tab === 'learn') renderLearn();
  else if (tab === 'test') test ? (test.done ? renderTestResult() : renderTestRun()) : renderTestSetup();
  else if (tab === 'settings') renderSettings();
  else renderRecords();
}

/* ---- test ---- */
const tcfg = { dans: new Set([1,2,3,4,5,6,7,8,9]), count: 20, limit: 0, random: true };
let test = null;
const LIMITS = [[0, 'なし', 'じっくり答える'], [10, '10秒', '1問ごとに10秒'], [5, '5秒', '少し急ぐ'], [3, '3秒', 'すらすら言えるか']];
const rangeLabel = (dans, limit, rand) => (dans.length === 9 ? 'すべての段' : dans.length <= 4 ? dans.join('・') + 'の段' : dans.length + 'つの段') + (rand === false ? ' / 順番' : '') + (limit ? ` / ${limit}秒` : '');
function testRows(n) {
  const L = db.tests.slice(-n).reverse();
  if (!L.length) return '<p class="text-sm rd">まだテストを受けていません。「テスト」から受けられます。</p>';
  return `<ul class="divide-soft">${L.map(x => `<li class="flex items-center gap-2 py-2.5 text-sm"><span class="rd tabular-nums w-24 shrink-0">${fmtDate(x.t)}</span><span class="flex-1 min-w-0 truncate">${rangeLabel(x.dans, x.limit, x.rand)}</span><span class="tabular-nums rd w-16 text-right">${x.ok}/${x.n}問</span><span class="tabular-nums font-bold w-12 text-right">${x.score}点</span><span class="w-10 text-right text-xs ${x.score >= 90 ? 'text-acc font-bold' : 'rd'}">${x.score >= 90 ? '合格' : ''}</span></li>`).join('')}</ul>`;
}
const testCount = () => { const p = tcfg.dans.size * 9; return tcfg.count === 'all' ? p : Math.min(tcfg.count, p); };
function renderTestSetup() {
  const nq = testCount();
  $('#app').innerHTML = `
  <section class="space-y-4">
    <div class="px-1"><h2 class="text-2xl font-bold">テスト</h2><p class="text-sm rd mt-1">答えるたびに次の問題へ進み、正解は最後にまとめて分かります。90点以上で合格です。</p></div>
    <div class="glass p-5">
      <div class="flex items-center justify-between mb-3"><h3 class="font-bold">テストする段</h3><div class="flex gap-3 text-sm"><button id="tall" class="text-acc hover:underline">すべて選ぶ</button><button id="tnone" class="text-slate-500 hover:underline">解除</button></div></div>
      <div class="grid grid-cols-9 gap-1.5 sm:gap-2">${NUM9.map(d => `<button data-tdan="${d}" aria-pressed="${tcfg.dans.has(d)}" class="border rounded-lg py-2.5 font-bold tabular-nums ${btn(tcfg.dans.has(d))}">${d}</button>`).join('')}</div>
    </div>
    <div class="glass p-5">
      <h3 class="font-bold mb-3">問題数</h3>
      <div class="flex gap-2">${[20, 40, 'all'].map(n => `<button data-tcount="${n}" class="border rounded-lg px-5 py-2 text-sm font-medium ${btn(String(tcfg.count) === String(n))}">${n === 'all' ? 'すべて' : n + '問'}</button>`).join('')}</div>
      <p class="text-sm rd mt-2 tabular-nums">出題数: ${nq}問(同じ問題は出ません)</p>
    </div>
    <div class="glass p-5">
      <h3 class="font-bold mb-3">出題順</h3>
      <button data-trand role="switch" aria-checked="${tcfg.random}" class="flex items-center gap-3 text-sm font-medium"><span class="sw"><i></i></span>バラ ${tcfg.random ? 'ON' : 'OFF'}</button>
      <p class="text-sm rd mt-2">${tcfg.random ? '順番をばらばらにして出題します。' : '選んだ段を、小さい段から順番どおりに出題します。'}</p>
    </div>
    <div class="glass p-5">
      <h3 class="font-bold mb-3">1問あたりの制限時間</h3>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${LIMITS.map(([k, v, s]) => `<button data-tlimit="${k}" class="border rounded-xl py-2.5 px-2 ${btn(tcfg.limit === k)}"><span class="block text-sm font-medium">${v}</span><span class="block text-xs opacity-70">${s}</span></button>`).join('')}</div>
      <p class="text-sm rd mt-2">時間をすぎると不正解になります。</p>
    </div>
    <div class="px-1"><button id="tstart" class="btn-accent rounded-xl w-full sm:w-auto sm:px-12 py-3 font-bold" ${tcfg.dans.size ? '' : 'disabled'}>テストをはじめる</button>${tcfg.dans.size ? '' : '<p class="text-sm rd mt-2">段を1つ以上えらんでください。</p>'}</div>
    <div class="glass p-5"><h3 class="font-bold mb-3">これまでのテスト</h3>${testRows(5)}</div>
  </section>`;
}
function startTest() {
  const dans = [...tcfg.dans].sort((a, b) => a - b); if (!dans.length) return;
  const pool = shuffle(dans.flatMap(a => NUM9.map(b => ({ a, b }))));
  const qs = pool.slice(0, testCount());
  if (!tcfg.random) qs.sort((x, y) => x.a - y.a || x.b - y.b);
  test = { qs, i: 0, input: '', res: [], done: false, t0: 0, limit: tcfg.limit, rand: tcfg.random, dans, timer: null };
  render();
}
function stopTest() { if (test) { clearTimeout(test.timer); test.timer = null; } }
function padHTML(attr) {
  return NUM9.map(n => `<button data-${attr}="${n}" class="glass-btn rounded-xl py-4 text-xl font-bold tabular-nums">${n}</button>`).join('')
    + `<button data-${attr}="bs" aria-label="ひとつ消す" class="glass-btn rounded-xl py-4 flex justify-center items-center text-slate-600">${ICON.back}</button>`
    + `<button data-${attr}="0" class="glass-btn rounded-xl py-4 text-xl font-bold">0</button>`
    + `<button data-${attr}="ok" class="btn-accent rounded-xl py-4 font-bold">決定</button>`;
}
function renderTestRun() {
  const q = test.qs[test.i];
  $('#app').innerHTML = `
  <section class="max-w-sm mx-auto glass p-5">
    <div class="flex items-center justify-between text-sm text-slate-500 mb-2"><span class="tabular-nums">${test.i + 1} / ${test.qs.length}</span><span>テスト</span><button id="tquit" class="underline hover:opacity-70">やめる</button></div>
    <div class="h-1.5 track rounded-full overflow-hidden ${test.limit ? 'mb-2' : 'mb-8'}"><div class="h-full bar-h transition-all" style="width:${test.i / test.qs.length * 100}%"></div></div>

async function exportData() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `kuku-backup-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
  const json = JSON.stringify({ app: 'kuku', version: 1, exportedAt: d.toISOString(), log: db.log, sessions: db.sessions, tests: db.tests, alongs: db.alongs }, null, 1);
  const T = window.__TAURI__;
  if (T && T.dialog && T.fs) {
    // デスクトップアプリ版: 保存ダイアログで保存先を選ぶ
    try {
      const path = await T.dialog.save({ defaultPath: name, filters: [{ name: 'JSON', extensions: ['json'] }] });
      if (!path) return;
      await T.fs.writeTextFile(path, json);
      setg.msg = { ok: true, text: 'バックアップを保存しました。' };
    } catch (e) { setg.msg = { ok: false, text: 'バックアップを保存できませんでした。' }; }
    return renderSettings();
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  setg.msg = { ok: true, text: 'バックアップを保存しました。' }; renderSettings();
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if (!j || j.app !== 'kuku' || !Array.isArray(j.log)) throw new Error('format');
      const int9 = v => Number.isInteger(v) && v >= 1 && v <= 9;
      const log = j.log.filter(x => x && int9(x.a) && int9(x.b) && Number.isFinite(x.t))
        .map(x => ({ t: x.t, a: x.a, b: x.b, ok: !!x.ok, ms: Math.min(Math.max(+x.ms || 0, 0), 60000), sp: Math.max(+x.sp || 0, 0), along: x.along ? 1 : undefined }));
      const ses = (Array.isArray(j.sessions) ? j.sessions : []).filter(x => x && Number.isFinite(x.t) && MODES[x.mode])
        .map(x => ({ t: x.t, mode: x.mode, n: +x.n || 0, ok: +x.ok || 0, sp: +x.sp || 0, res: cleanSRes(x.res) }));
      const cleanRes = a => { if (!Array.isArray(a)) return undefined; const o = a.filter(r => Array.isArray(r) && int9(r[0]) && int9(r[1])).map(r => [r[0], r[1], r[2] ? 1 : 0, Math.min(Math.max(+r[3] || 0, 0), 60000), Number.isFinite(r[4]) ? r[4] : null, r[5] ? 1 : 0]); return o.length ? o : undefined; };
      const tst = (Array.isArray(j.tests) ? j.tests : []).filter(x => x && Number.isFinite(x.t) && Number.isFinite(x.score) && Array.isArray(x.dans))
        .map(x => ({ t: x.t, n: +x.n || 0, ok: +x.ok || 0, score: Math.min(Math.max(Math.round(x.score), 0), 100), dans: x.dans.filter(int9), limit: [3, 5, 10].includes(+x.limit) ? +x.limit : 0, rand: x.rand !== false, res: cleanRes(x.res) })).filter(x => x.dans.length);
      const alg = cleanAlongs(j.alongs);
      if (setg.imode === 'replace') {
        if (!confirm('いまの記録をバックアップの内容で置き換えます。よろしいですか?')) return;
        db.log = log; db.sessions = ses; db.tests = tst; db.alongs = alg;
        setg.msg = { ok: true, text: `置き換えました(回答記録 ${log.length}件 / 学習履歴 ${ses.length}件 / テスト ${tst.length}件 / やりながら ${alg.length}件)。` };
      } else {
        const k1 = x => x.t + ':' + x.a + 'x' + x.b, k2 = x => x.t + ':' + x.mode;
        const s1 = new Set(db.log.map(k1)), s2 = new Set(db.sessions.map(k2)); let n1 = 0, n2 = 0, n3 = 0, n4 = 0;
        log.forEach(x => { if (!s1.has(k1(x))) { s1.add(k1(x)); db.log.push(x); n1++; } });
        ses.forEach(x => { if (!s2.has(k2(x))) { s2.add(k2(x)); db.sessions.push(x); n2++; } });
        db.log.sort((x, y) => x.t - y.t); db.sessions.sort((x, y) => x.t - y.t);
        const s3 = new Set(db.tests.map(x => x.t));
        tst.forEach(x => { if (!s3.has(x.t)) { s3.add(x.t); db.tests.push(x); n3++; } });
        db.tests.sort((x, y) => x.t - y.t);
        const s4 = new Set(db.alongs.map(x => x.t));
        alg.forEach(x => { if (!s4.has(x.t)) { s4.add(x.t); db.alongs.push(x); n4++; } });
        db.alongs.sort((x, y) => x.t - y.t);
        setg.msg = { ok: true, text: `追加しました(回答記録 ${n1}件 / 学習履歴 ${n2}件 / テスト ${n3}件 / やりながら ${n4}件)。` };
      }
      save();
    } catch (e) { setg.msg = { ok: false, text: 'このファイルは読み込めませんでした。九九れんしゅうのバックアップファイルを選んでください。' }; }
    renderSettings();
  };
  fr.readAsText(file);
}
$('#app').addEventListener('change', e => {
  if (e.target.id === 'goalInput') setGoal(e.target.value);
  if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) importData(e.target.files[0]);
});

/* ---- home ---- */
function streak() {
  const days = new Set(db.log.map(x => new Date(x.t).toDateString()));
  const d = new Date(); let n = 0;
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

      <div class="h-2 track rounded-full overflow-hidden mt-3" role="progressbar" aria-valuenow="${bar}" aria-valuemin="0" aria-valuemax="100"><div class="h-full bar-h transition-all" style="width:${bar}%"></div></div>
      ${reached ? `<p class="text-sm font-bold text-acc mt-3">${ICON.ok} Goal reached!</p>` : `<p class="text-sm rd mt-3">目標まであと ${g - todaySP} SP</p>`}

        <button data-learn="along" class="glass-btn rounded-xl p-4 text-left"><span class="block font-bold">やりながら覚える</span><span class="block text-sm text-slate-500 mt-1">答えを見ながら入力して覚えます</span></button>
        <button data-gotab="test" class="glass-btn rounded-xl p-4 text-left"><span class="block font-bold">テスト</span><span class="block text-sm text-slate-500 mt-1">覚えられたか確認します</span></button>

/* ---- setup ---- */

    else if (dans.length) {
      const w = weakList(dans, 5);
      extra = `<div class="mt-3"><p class="text-sm text-slate-500 mb-2">いま苦手な問題</p><div class="flex flex-wrap gap-2">${w.map(x => `<span class="px-2.5 py-1 rounded-md glass-chip text-sm tabular-nums">${x.a} × ${x.b}</span>`).join('')}</div></div>`;
    }
  }
  $('#app').innerHTML = `
  <section class="space-y-4">
    <h2 class="text-2xl font-bold px-1">学習</h2>

      </div>

    <div class="glass p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold">練習する段</h2>
        <div class="flex gap-3 text-sm"><button id="allDan" class="text-acc hover:underline">すべて選ぶ</button><button id="noDan" class="text-slate-500 hover:underline">解除</button></div>
      </div>
      <div class="grid grid-cols-9 gap-1.5 sm:gap-2">
        ${[1,2,3,4,5,6,7,8,9].map(d => `<button data-dan="${d}" aria-pressed="${cfg.dans.has(d)}" class="border rounded-lg py-2.5 font-bold tabular-nums ${btn(cfg.dans.has(d))}">${d}</button>`).join('')}
      </div>

    </div>

      <h2 class="font-bold mb-3">むずかしさ</h2>
      <div class="grid grid-cols-3 gap-2">
        ${Object.entries(DIFF).map(([k, v]) => `<button data-diff="${k}" class="border rounded-lg py-2.5 px-2 text-left ${btn(cfg.diff === k)}"><span class="block text-sm font-medium">${v[0]}</span><span class="block text-xs opacity-80">${v[1]}</span></button>`).join('')}
      </div>
    </div>` : ''}
    ${ordered ? '' : `<div class="glass p-5">
      <h2 class="font-bold mb-3">問題数</h2>
      <div class="flex gap-2">
        ${[10, 20, 'all'].map(n => `<button data-count="${n}" class="border rounded-lg px-5 py-2 text-sm font-medium ${btn(String(cfg.count) === String(n))}">${n === 'all' ? (weak ? '20問' : 'すべて') : n + '問'}</button>`).join('')}
      </div>
    </div>`}
    <div class="px-1">
      <button id="start" class="w-full sm:w-auto sm:px-12 btn-accent text-white rounded-lg py-3 font-bold disabled:bg-slate-200 disabled:text-slate-400" ${!dans.length || (weak && !hasLog()) ? 'disabled' : ''}>はじめる</button>

$('#app').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.go) { cfg.mode = d.go; tab = 'study'; render(); return; }
  if (d.gotab) { tab = d.gotab; render(); return; }
  if (d.learn) { learn.sub = d.learn; tab = 'learn'; render(); return; }
  if (tab === 'study' && !quiz) {
    if (d.mode) { cfg.mode = d.mode; renderSetup(); }
    else if (d.dan) { const n = +d.dan; cfg.dans.has(n) ? cfg.dans.delete(n) : cfg.dans.add(n); renderSetup(); }
    else if (t.id === 'allDan') { cfg.dans = new Set([1,2,3,4,5,6,7,8,9]); renderSetup(); }
    else if (t.id === 'noDan') { cfg.dans.clear(); renderSetup(); }
    else if (d.diff) { cfg.diff = d.diff; renderSetup(); }
    else if (d.count) { cfg.count = d.count === 'all' ? 'all' : +d.count; renderSetup(); }
    else if (t.id === 'start') startQuiz();
  } else if (quiz && !quiz.done) {
    if (d.pad !== undefined) press(d.pad);
    else if (t.id === 'quit') { if (confirm('学習を中断しますか?(ここまでの回答は記録されます)')) finish(true); }
    else if (t.id === 'next') nextQ();
  } else if (quiz && quiz.done) {
    if (t.id === 'again') startQuiz(); else if (t.id === 'home') { quiz = null; render(); }
  } else if (tab === 'records') {
    if (d.rlist) { rec.kind = d.rlist; rec.filter = 'all'; rec.view = 'list'; renderRecords(); try { window.scrollTo(0, 0); } catch (e) {} }
    else if (t.id === 'recBack') { rec.view = rec.view === 'detail' ? 'list' : 'main'; renderRecords(); try { window.scrollTo(0, 0); } catch (e) {} }
    else if (d.rsel !== undefined) { rec.sel = +d.rsel; rec.view = 'detail'; renderRecords(); try { window.scrollTo(0, 0); } catch (e) {} }
    else if (d.rfilter) { rec.filter = d.rfilter; renderRecords(); }
    else if (d.period) { sp.period = d.period; sp.off = 0; renderRecords(); }
    else if (d.off) { sp.off += +d.off; if (sp.off > 0) sp.off = 0; renderRecords(); }
    else if (t.id === 'reset') { if (confirm('すべての学習記録を削除します。よろしいですか?')) { db = { log: [], sessions: [], tests: [], alongs: [], ui: db.ui }; save(); renderRecords(); } }
  } else if (tab === 'learn') {
    if (d.lsub) { learn.sub = d.lsub; renderLearn(); }
    else if (d.lord) { learn.order = d.lord; renderLearn(); }
    else if (t.id === 'astart') startAlong();
    else if (d.apad !== undefined) apress(d.apad);
    else if (t.id === 'aquit' || t.id === 'ahome') { endAlong(); renderLearn(); }
    else if (t.id === 'aagain') startAlong();
    else if (t.id === 'atry') { cfg.dans = new Set(learn.dans); cfg.mode = 'asc'; endAlong(); tab = 'study'; render(); }
    else if (d.furi !== undefined) { db.ui.furi = !db.ui.furi; save(); renderLearn(); }
    else if (d.ldan) { const n = +d.ldan; learn.dans.has(n) ? learn.dans.delete(n) : learn.dans.add(n); renderLearn(); }
    else if (d.cell) { const [a, b] = d.cell.split(',').map(Number); learn.sel = learn.sel && learn.sel[0] === a && learn.sel[1] === b ? null : [a, b]; renderLearn(); }
  } else if (tab === 'test') {
    if (!test) {
      if (d.tdan) { const n = +d.tdan; tcfg.dans.has(n) ? tcfg.dans.delete(n) : tcfg.dans.add(n); renderTestSetup(); }
      else if (t.id === 'tall') { tcfg.dans = new Set(NUM9); renderTestSetup(); }
      else if (t.id === 'tnone') { tcfg.dans.clear(); renderTestSetup(); }
      else if (d.tcount) { tcfg.count = d.tcount === 'all' ? 'all' : +d.tcount; renderTestSetup(); }
      else if (d.tlimit) { tcfg.limit = +d.tlimit; renderTestSetup(); }
      else if (d.trand !== undefined) { tcfg.random = !tcfg.random; renderTestSetup(); }
      else if (t.id === 'tstart') startTest();
    } else if (!test.done) {
      if (d.tpad !== undefined) tpress(d.tpad);
      else if (t.id === 'tquit') { if (confirm('テストを中断しますか?(結果は保存されません)')) { stopTest(); test = null; render(); } }
    } else {
      if (t.id === 'tagain') startTest();
      else if (t.id === 'thome') { test = null; render(); }
      else if (t.id === 'treview') { learn.dans = new Set(test.wrongDans); learn.sub = 'memo'; test = null; tab = 'learn'; render(); }
    }
  } else if (tab === 'settings') {
    if (d.theme) { db.ui.theme = d.theme; save(); applyTheme(); renderSettings(); }
    else if (d.imode) { setg.imode = d.imode; renderSettings(); }
    else if (d.goal) setGoal(+d.goal);
    else if (d.goalstep) setGoal(goal() + +d.goalstep);
    else if (t.id === 'export') exportData();
  }
});

/* ---- quiz ---- */
function startQuiz() {
  const qs = buildQuestions(); if (!qs.length) return;
  quiz = { qs, i: 0, input: '', locked: false, t0: Date.now(), res: [], done: false, mode: cfg.mode, timer: null };
  render();
}
function renderQuiz() {
  const q = quiz.qs[quiz.i], pct = quiz.i / quiz.qs.length * 100;
  const pad = [1,2,3,4,5,6,7,8,9].map(n => `<button data-pad="${n}" class="glass-btn rounded-xl py-4 text-xl font-bold tabular-nums">${n}</button>`).join('')
    + `<button data-pad="bs" aria-label="ひとつ消す" class="glass-btn rounded-xl py-4 flex justify-center items-center text-slate-600">${ICON.back}</button>`
    + `<button data-pad="0" class="glass-btn rounded-xl py-4 text-xl font-bold">0</button>`
    + `<button data-pad="ok" class="rounded-lg py-4 font-bold btn-accent text-white">決定</button>`;
  $('#app').innerHTML = `
  <section class="max-w-sm mx-auto glass p-5">
    <div class="flex items-center justify-between text-sm text-slate-500 mb-2">
      <span class="tabular-nums">${quiz.i + 1} / ${quiz.qs.length}</span>
      <span>${MODES[quiz.mode]}</span>
      <button id="quit" class="text-slate-500 hover:opacity-70 underline">やめる</button>
    </div>
    <div class="h-1.5 track rounded-full overflow-hidden mb-8"><div class="h-full bar-h transition-all" style="width:${pct}%"></div></div>
    <p class="text-center text-5xl sm:text-6xl font-bold tabular-nums mb-6">${q.a} × ${q.b}</p>
    <div id="ans" class="ans rounded-xl h-16 flex items-center justify-center text-3xl font-bold tabular-nums mb-3"></div>
    <div id="fb" class="h-12 flex items-center justify-center mb-2" aria-live="polite"></div>
    <div class="grid grid-cols-3 gap-2">${pad}</div>
  </section>`;
  showInput();
  quiz.t0 = Date.now();
}
function showInput() {
  const el = $('#ans'); if (!el) return;
  el.innerHTML = quiz.input || '<span class="text-slate-300">答えを入力</span>';
}
function press(k) {
  if (quiz.locked) { if (k === 'ok') nextQ(); return; }
  if (k === 'bs') quiz.input = quiz.input.slice(0, -1);
  else if (k === 'ok') return submit();
  else if (quiz.input.length < 2) quiz.input = (quiz.input === '0' ? '' : quiz.input) + k;
  showInput();
}
function submit() {
  if (!quiz.input) return;
  const q = quiz.qs[quiz.i], ms = Date.now() - quiz.t0, ans = +quiz.input, ok = ans === q.a * q.b;
  const pts = ok ? 10 + (ms < 3000 ? 5 : 0) : 0;
  const rec = { t: Date.now(), a: q.a, b: q.b, ok, ms: Math.min(ms, 60000), sp: pts };
  db.log.push(rec); save(); quiz.res.push({ ...rec, ans }); quiz.locked = true;
  const fb = $('#fb'), box = $('#ans');
  if (ok) {
    box.classList.add('ans-ok');
    fb.innerHTML = `<span class="text-acc font-bold text-lg">${ICON.ok} Great!</span><span class="ml-3 text-sm text-slate-500 tabular-nums">+${pts} SP</span>`;
    quiz.timer = setTimeout(nextQ, 800);
  } else {
    box.classList.add('ans-ng');
    fb.innerHTML = `<span class="text-slate-700 font-bold">${ICON.ng} 正解は <span class="text-xl tabular-nums">${q.a * q.b}</span></span><button id="next" class="ml-4 px-4 py-1.5 rounded-lg glass-btn text-sm">つぎへ</button>`;
  }
}
function nextQ() {
  clearTimeout(quiz.timer);
  if (!quiz.locked) return;
  quiz.i++; quiz.input = ''; quiz.locked = false;
  quiz.i >= quiz.qs.length ? finish(false) : renderQuiz();
}
function finish(aborted) {
  clearTimeout(quiz.timer);
  if (aborted && !quiz.res.length) { quiz = null; return render(); }
  const r = quiz.res, ok = r.filter(x => x.ok).length;
  quiz.sum = { t: Date.now(), mode: quiz.mode, n: r.length, ok, sp: r.reduce((s, x) => s + x.sp, 0), res: r.map(x => [x.a, x.b, x.ok ? 1 : 0, x.ms, x.ans, x.sp]) };
  db.sessions.push(quiz.sum); save(); quiz.done = true; render();
}
function renderResult() {
  const s = quiz.sum, r = quiz.res, perfect = s.ok === s.n;
  const avg = (r.reduce((a, x) => a + x.ms, 0) / r.length / 1000).toFixed(1);
  const wrong = r.filter(x => !x.ok);
  $('#app').innerHTML = `
  <section class="max-w-sm mx-auto text-center glass p-6">
    <h2 class="text-3xl font-bold mb-1">${perfect ? 'Congratulations!' : 'Good job!'}</h2>

  <section class="space-y-4">
    ${pageHead('やりながら覚える記録')}
    ${n ? `<dl class="grid grid-cols-2 sm:grid-cols-4 gap-3">${statCard(n + '回', '練習した回数')}${statCard(tq + '問', '練習した問題')}${statCard(tsp, '獲得 SP')}${statCard(tm + '回', '入力ミス')}</dl>
    <div class="glass p-5"><h3 class="font-bold mb-1">練習一覧</h3><p class="text-sm rd mb-2">押すと、1問ごとの結果を見られます。</p>
      <ul class="divide-soft">${L.map((x, i) => [x, i]).reverse().map(([x, i]) => rowBtn(i, `<span class="rd tabular-nums w-24 shrink-0">${fmtDate(x.t)}</span><span class="flex-1 min-w-0 truncate">${rangeLabel(x.dans, 0)} / ${ORD_LABEL[x.order]}</span><span class="tabular-nums rd w-16 text-right">${x.n}/${x.total}問</span><span class="tabular-nums w-16 text-right">+${x.sp}</span><span class="text-xs rd w-14 text-right">ミス${x.miss}</span>`)).join('')}</ul></div>`
    : '<div class="glass p-8 text-center rd text-sm">まだ記録がありません。「覚える」の「やりながら覚える」で練習すると、ここに記録されます。</div>'}
    ${oldN > 0 ? `<p class="text-xs rd px-1">以前の「やりながら覚える」で獲得した SP(${oldN}問分)は、SP の合計には入っていますが、この一覧には表示されません。</p>` : ''}
  </section>`;
}
function renderAlongDetail() {
  const x = db.alongs[rec.sel];
  if (!x) { rec.view = 'list'; return renderRecords(); }
  const res = x.res, avg = res.reduce((s, r) => s + r[2], 0) / res.length;
  const per = [...new Set(res.map(r => r[0]))].sort((a, b) => a - b).map(a => { const rs = res.filter(r => r[0] === a);
    return `<li class="flex items-center gap-3 py-1.5 text-sm"><span class="w-12 shrink-0">${a}の段</span><span class="flex-1 rd tabular-nums">${rs.length}問</span><span class="tabular-nums">平均 ${sec(rs.reduce((s, r) => s + r[2], 0) / rs.length)}</span><span class="tabular-nums rd w-16 text-right">ミス${rs.reduce((s, r) => s + r[3], 0)}回</span></li>`; }).join('');
  const w = res.filter(r => r[3] > 0).sort((p, q) => q[3] - p[3]);
  $('#app').innerHTML = `
  <section class="space-y-4 max-w-2xl">
    ${pageHead('練習の詳細')}
    <div class="glass p-6 text-center"><p class="rd text-sm mb-2">${fmtDate(x.t)}</p><p class="text-6xl font-bold tabular-nums">${x.n}<span class="text-2xl ml-1">問</span></p><p class="mt-2 text-sm tabular-nums text-acc font-bold">+${x.sp} SP</p></div>
    <div class="glass px-5 py-2"><dl class="divide-soft">${infoRow('範囲', rangeLabel(x.dans, 0))}${infoRow('順番', ORD_LABEL[x.order])}${infoRow('練習した問題', x.n + ' / ' + x.total + '問')}${infoRow('状態', x.done ? '最後まで完了' : '途中でやめた')}${infoRow('平均時間', sec(avg))}${infoRow('入力ミス', x.miss + '回')}</dl></div>
    <div class="glass p-5"><h3 class="font-bold mb-2">段ごとの結果</h3><ul>${per}</ul></div>
    ${w.length ? listPanel('入力をまちがえた問題', w, r => 'ミス ' + r[3] + '回') : ''}
    ${qTable(['No.', '問題', '入力ミス', '時間'], res.map((r, i) => [i + 1, eq(r), r[3] ? r[3] + '回' : 'なし', sec(r[2])]))}
  </section>`;
}

/* ---- records ---- */
function renderRecords() {
  if (rec.view === 'list') return rec.kind === 'study' ? renderStudyList() : rec.kind === 'along' ? renderAlongList() : renderTestList();
  if (rec.view === 'detail') return rec.kind === 'study' ? renderStudyDetail() : rec.kind === 'along' ? renderAlongDetail() : renderTestDetail();
  const L = db.log, R = L.filter(x => !x.along), total = R.length, ok = R.filter(x => x.ok).length;
  const days = new Set(L.map(x => new Date(x.t).toDateString())).size;
  const spSum = L.reduce((s, x) => s + x.sp, 0), st = stats();
  const card = (v, l) => `<div class="glass py-3 text-center"><dd class="text-xl font-bold tabular-nums">${v}</dd><dt class="text-xs text-slate-500">${l}</dt></div>`;
  let grid = `<table class="w-full text-center text-sm tabular-nums border-separate border-spacing-1"><thead><tr><th class="w-10"></th>${[1,2,3,4,5,6,7,8,9].map(b => `<th class="font-normal text-slate-500">×${b}</th>`).join('')}</tr></thead><tbody>`;
  for (let a = 1; a <= 9; a++) {
    grid += `<tr><th class="font-normal text-slate-500 text-right pr-1">${a}の段</th>`;
    for (let b = 1; b <= 9; b++) {
      const rs = st[key(a, b)];
      let cls = 'hm-none', txt = '-', tip = '未学習';
      if (rs) {
        const acc = rs.filter(x => x.ok).length / rs.length; txt = Math.round(acc * 100);
        const pct = Math.round(acc * 100); cls = pct >= 80 ? 'hm-g' : pct >= 40 ? 'hm-b' : pct >= 20 ? 'hm-y' : 'hm-r';
        tip = `${a}×${b}: ${rs.length}回中 ${rs.filter(x => x.ok).length}回正解`;
      }
      grid += `<td title="${tip}" class="rounded py-1.5 ${cls}">${txt}</td>`;
    }
    grid += '</tr>';
  }
  grid += '</tbody></table>';
  const recent = db.sessions.slice(-8).reverse();
  $('#app').innerHTML = `
  <section class="space-y-4">
    <h2 class="text-2xl font-bold px-1">記録</h2>
    <dl class="grid grid-cols-2 sm:grid-cols-4 gap-3">${card(spSum.toLocaleString(), '累計 SP')}${card(total.toLocaleString(), '回答数')}${card(total ? Math.round(ok / total * 100) + '%' : '-', '正答率')}${card(days + '日', '学習した日')}</dl>
    <div class="glass p-5"><h2 class="font-bold mb-4">SP の内訳</h2>${spHTML()}</div>
    <div class="glass p-5">
      <h2 class="font-bold mb-1">問題ごとの正答率(%)</h2>
      <p class="text-sm text-slate-500 mb-3">全期間の結果です。赤に近いほど苦手です。</p>
      <div class="overflow-x-auto"><div class="min-w-[480px]">${grid}</div></div>
      <div class="flex flex-wrap gap-4 text-xs text-slate-500 mt-2"><span><i class="inline-block w-3 h-3 rounded align-middle hm-g"></i> 80〜100%</span><span><i class="inline-block w-3 h-3 rounded align-middle hm-b"></i> 40〜79%</span><span><i class="inline-block w-3 h-3 rounded align-middle hm-y"></i> 20〜39%</span><span><i class="inline-block w-3 h-3 rounded align-middle hm-r"></i> 0〜19%</span><span><i class="inline-block w-3 h-3 rounded align-middle hm-none"></i> 未学習</span></div>
    </div>
    <div class="glass p-5">
      <div class="flex items-center justify-between gap-3 mb-3"><h2 class="font-bold">最近の学習</h2><button data-rlist="study" class="btn-accent rounded-lg px-4 py-2 text-sm font-medium">学習記録を表示</button></div>
      ${recent.length ? `<ul class="divide-soft">${recent.map(s => `<li class="flex items-center justify-between px-4 py-2.5 text-sm"><span class="text-slate-500 tabular-nums w-28">${fmtDate(s.t)}</span><span class="flex-1">${MODES[s.mode]}</span><span class="tabular-nums w-24 text-right">${s.ok} / ${s.n} 問</span><span class="tabular-nums w-20 text-right text-acc">+${s.sp} SP</span></li>`).join('')}</ul>` : '<p class="text-sm text-slate-500">まだ学習記録がありません。「学習」から始めましょう。</p>'}
    </div>
    <div class="glass p-5">
      <div class="flex items-center justify-between gap-3 mb-3"><h2 class="font-bold">やりながら覚える記録</h2><button data-rlist="along" class="btn-accent rounded-lg px-4 py-2 text-sm font-medium">やりながら覚える記録を表示</button></div>
      ${alongRows(5)}
    </div>
    <div class="glass p-5">
      <div class="flex items-center justify-between gap-3 mb-3"><h2 class="font-bold">テスト結果</h2><button data-rlist="test" class="btn-accent rounded-lg px-4 py-2 text-sm font-medium">テスト記録を表示</button></div>
      ${testRows(8)}
    </div>
    <div class="px-1"><button id="reset" class="text-sm text-slate-500 hover:text-red-500 underline" ${L.length ? '' : 'disabled'}>学習記録をすべて削除</button></div>
  </section>`;
}

/* ---- SP ---- */
function range(p, off) {
  const n = new Date(); let s, e, label;
  if (p === 'day') { s = new Date(n.getFullYear(), n.getMonth(), n.getDate() + off); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 1); label = `${s.getFullYear()}年${s.getMonth()+1}月${s.getDate()}日`; }
  else if (p === 'week') { const dow = (n.getDay() + 6) % 7; s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - dow + off * 7); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7); const l = new Date(e - 1); label = `${s.getMonth()+1}/${s.getDate()} 〜 ${l.getMonth()+1}/${l.getDate()}`; }
  else if (p === 'month') { s = new Date(n.getFullYear(), n.getMonth() + off, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 1); label = `${s.getFullYear()}年${s.getMonth()+1}月`; }
  else { s = new Date(n.getFullYear() + off, 0, 1); e = new Date(s.getFullYear() + 1, 0, 1); label = `${s.getFullYear()}年`; }
  return { s: +s, e: +e, label };
}
function pie(vals, total) {
  const R = 90, C = 100; let ang = -Math.PI / 2, out = '';
  const pt = a => [C + R * Math.cos(a), C + R * Math.sin(a)];
  vals.forEach((v, i) => {
    if (!v) return;
    if (v === total) { out += `<circle cx="${C}" cy="${C}" r="${R}" fill="${COLORS[i]}"/>`; return; }
    const a2 = ang + v / total * Math.PI * 2, [x1, y1] = pt(ang), [x2, y2] = pt(a2);
    out += `<path d="M${C} ${C}L${x1} ${y1}A${R} ${R} 0 ${a2 - ang > Math.PI ? 1 : 0} 1 ${x2} ${y2}Z" fill="${COLORS[i]}" style="stroke:var(--hole)" stroke-width="1.5"/>`;
    ang = a2;
  });
  return `<svg viewBox="0 0 200 200" class="w-56 h-56 shrink-0" role="img" aria-label="段ごとのSP割合">${out}<circle cx="${C}" cy="${C}" r="52" style="fill:var(--hole)"/><text x="${C}" y="${C + 4}" text-anchor="middle" font-size="24" font-weight="700" style="fill:var(--fg)">${total}</text><text x="${C}" y="${C + 22}" text-anchor="middle" font-size="11" fill="#64748b">SP</text></svg>`;
}
function spHTML() {
  const r = range(sp.period, sp.off), vals = Array(9).fill(0);
  db.log.forEach(x => { if (x.t >= r.s && x.t < r.e) vals[x.a - 1] += x.sp; });
  const total = vals.reduce((a, b) => a + b, 0);
  const P = { day: '日', week: '週', month: '月', year: '年' };
  return `
  <div>
    <div class="glass inline-flex overflow-hidden p-1 gap-1 mb-5" role="tablist">
      ${Object.entries(P).map(([k, v]) => `<button data-period="${k}" role="tab" aria-selected="${sp.period === k}" class="px-5 py-2 rounded-lg text-sm font-medium ${sp.period === k ? 'btn-accent text-white' : 'text-slate-700 nav-hover'}">${v}</button>`).join('')}
    </div>
    <div class="flex items-center gap-2 mb-6">
      <button data-off="-1" aria-label="前へ" class="p-1.5 rounded-lg glass-btn">${ICON.prev}</button>
      <span class="font-bold tabular-nums min-w-[10rem] text-center">${r.label}</span>
      <button data-off="1" aria-label="次へ" class="p-1.5 rounded-lg glass-btn disabled:opacity-30" ${sp.off >= 0 ? 'disabled' : ''}>${ICON.next}</button>
    </div>
    ${total ? `<div class="flex flex-col sm:flex-row items-center gap-8">
      ${pie(vals, total)}
      <ul class="w-full text-sm">${vals.map((v, i) => `<li class="flex items-center gap-3 py-1.5 ${v ? '' : 'text-slate-400'}"><i class="w-3 h-3 rounded-sm shrink-0 border border-black/5" style="background:${COLORS[i]}"></i><span class="w-14">${i + 1}の段</span><span class="flex-1 text-right tabular-nums">${v} SP</span><span class="w-12 text-right tabular-nums">${Math.round(v / total * 100)}%</span></li>`).join('')}</ul>
    </div>` : `<p class="text-slate-500 py-12 text-center glass">この期間の SP はまだありません。<br>「学習」で問題に正解すると SP がたまります。</p>`}
    <p class="text-xs text-slate-500 mt-6">SP: 正解1問につき 10 SP。3秒以内に答えると +5 SP。</p>
  </div>`;
}

render();
})();
</script>
</body>
</html>
