<body class="antialiased min-h-screen">
<div class="flex min-h-screen">
  <aside class="glass m-2 sm:m-3 p-2 sm:p-3 w-14 sm:w-52 shrink-0 sticky top-2 sm:top-3 self-start h-[calc(100vh-1rem)] sm:h-[calc(100vh-1.5rem)] flex flex-col">
    <h1 class="font-bold py-3 text-center sm:text-left sm:px-2 text-sm sm:text-base"><span class="sm:hidden">九九</span><span class="hidden sm:inline">九九れんしゅう</span></h1>
    <nav id="nav" class="flex flex-col gap-1 flex-1" aria-label="メニュー"></nav>
  </aside>
  <main id="app" class="flex-1 min-w-0 w-full max-w-4xl px-3 sm:px-8 py-4 sm:py-8"></main>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const LS = 'kuku-v1';
let db;
try { db = JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { db = {}; }
db.log = db.log || []; db.sessions = db.sessions || []; db.tests = db.tests || []; db.alongs = db.alongs || []; db.courses = db.courses || []; db.myCourses = db.myCourses || []; db.watches = db.watches || [];
const save = () => { try { localStorage.setItem(LS, JSON.stringify(db)); } catch (e) {} };
db.ui = Object.assign({ theme: 'system', furi: true, goal: 100, strict: 4 }, db.ui);
const goal = () => Math.min(Math.max(Math.round(+db.ui.goal) || 100, 10), 9999);
const setGoal = v => { db.ui.goal = Math.min(Math.max(Math.round(+v) || goal(), 10), 9999); save(); renderSettings(); };
// 判定のきびしさ: r = まちがえてよい割合(0 = 1問もまちがえられない), m = SP の倍率
const STRICT = [{ r: 0.5, m: 0.4 }, { r: 0.4, m: 0.6 }, { r: 0.3, m: 0.75 }, { r: 0.2, m: 0.9 }, { r: 0.1, m: 1 }, { r: 0, m: 1.5 }];
const strictLv = () => { const v = Math.round(+db.ui.strict); return v >= 0 && v <= 5 ? v : 4; };
const allowedMistakes = (n, lv = strictLv()) => STRICT[lv].r === 0 ? 0 : Math.min(Math.ceil(n * STRICT[lv].r - 1e-9), Math.max(n - 1, 0));
const strictMult = (lv = strictLv()) => STRICT[lv].m;
const isPass = x => x.pass != null ? !!x.pass : x.score > 89;
const strictText = (n, lv) => `まちがえてもOK: ${allowedMistakes(n, lv)}問まで(${n}問のとき) ・ SP ×${strictMult(lv)}`;
function strictPanel(n) {
  return `<div class="glass p-5"><h3 class="font-bold mb-1">判定のきびしさ</h3><p class="text-sm rd mb-4">左へ動かすほどゆるく(SP は減ります)、右へ動かすほどきびしく(SP は増えます)なります。</p>
    <div class="flex items-center gap-3"><span class="text-xs rd shrink-0">ゆるい</span><input id="strictRange" data-n="${n}" type="range" min="0" max="5" step="1" value="${strictLv()}" aria-label="判定のきびしさ" class="strict-range flex-1"><span class="text-xs rd shrink-0">きびしい</span></div>
    <p id="strictInfo" class="text-sm mt-3 tabular-nums font-medium">${strictText(n, strictLv())}</p></div>`;
}
const greeting = h => h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 18 ? 'Good afternoon' : 'Good evening';
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const t = db.ui.theme, dark = t === 'dark' || (t === 'system' && mq && mq.matches);
  document.documentElement.classList.toggle('dark', dark);
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);
applyTheme();

const MODES = { asc: '順番(上がり)', desc: '順番(下がり)', rand: 'バラ', weak: '苦手モード' };
const MODE_DESC = { asc: '1×1 から 1×9 の順に出題します', desc: '1×9 から 1×1 の順に出題します', rand: '順番をばらばらにして出題します', weak: '過去の間違いや時間のかかった問題を優先して出題します' };
const DIFF = { easy: ['かんたん', '掛ける数が 1〜5'], normal: ['ふつう', '掛ける数が 1〜9 すべて'], hard: ['むずかしい', '掛ける数が 6〜9'] };
const COLORS = ['#334155', '#64748b', '#cbd5e1', '#2563eb', '#93c5fd', '#7c3aed', '#c4b5fd', '#e11d48', '#fda4af'];
const ICON = {
  back: '<svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m13 9 4 6M17 9l-4 6"/></svg>',
  ok: '<svg viewBox="0 0 24 24" class="w-5 h-5 inline" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  ng: '<svg viewBox="0 0 24 24" class="w-5 h-5 inline" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
  prev: '<svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>'
};

const cfg = { mode: 'asc', dans: new Set([1,2,3,4,5,6,7,8,9]), count: 10, diff: 'normal' };
let tab = 'home', quiz = null, sp = { period: 'day', off: 0 };
const learn = { sub: 'table', dans: new Set([1]), sel: null, order: 'asc', run: null };
const setg = { imode: 'merge', msg: null };
const rec = { view: 'main', kind: 'test', sel: null, filter: 'all', kind2: 'all' };
let course = null;
const cc = { dan: 1, view: 'list' };

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const key = (a, b) => a + 'x' + b;
const btn = (on) => on ? 'btn-accent text-white' : 'glass-btn text-slate-700';
const fmtDate = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

/* ---- stats ---- */
const hasLog = () => db.log.some(x => !x.along);
const ALONG_SP = 5;
function stats() {
  const m = {};
  for (const r of db.log) { if (r.along) continue; const k = key(r.a, r.b); (m[k] = m[k] || []).push(r); }
  return m;
}
function weakScore(rs) {
  if (!rs) return 0.5;
  const r = rs.slice(-10), n = r.length;
  const wr = r.filter(x => !x.ok).length / n;
  const avg = r.reduce((s, x) => s + x.ms, 0) / n;
  const slow = Math.min(Math.max((avg - 2500) / 6000, 0), 1);
  return wr * 3 + slow + (n < 3 ? 0.3 : 0);
}
function weakList(dans, n) {
  const st = stats(), out = [];
  for (const a of dans) for (let b = 1; b <= 9; b++) out.push({ a, b, s: weakScore(st[key(a, b)]), seen: !!st[key(a, b)] });
  return shuffle(out).sort((x, y) => y.s - x.s).slice(0, n);
}

/* ---- question building ---- */
function buildQuestions(c = cfg) {
  const dans = [...c.dans].sort((a, b) => a - b), q = [];
  if (c.mode === 'asc') dans.forEach(a => { for (let b = 1; b <= 9; b++) q.push({ a, b }); });
  else if (c.mode === 'desc') dans.forEach(a => { for (let b = 9; b >= 1; b--) q.push({ a, b }); });
  else if (c.mode === 'rand') {
    const [lo, hi] = c.diff === 'easy' ? [1, 5] : c.diff === 'hard' ? [6, 9] : [1, 9];
    let pool = [];
    dans.forEach(a => { for (let b = lo; b <= hi; b++) pool.push({ a, b }); });
    pool = shuffle(pool);
    const n = c.count === 'all' ? pool.length : Math.min(c.count, pool.length);
    return pool.slice(0, n);
  } else {
    const n = c.count === 'all' ? 20 : c.count;
    return shuffle(weakList(dans, n).map(({ a, b }) => ({ a, b })));
  }
  return c.take ? q.slice(0, c.take) : q;
}

/* ---- render: nav ---- */
function renderNav() {
  const P = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    study: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
    learn: '<path d="M12 6c-1.5-1.2-3.5-2-6-2H3v14h3c2.5 0 4.5.8 6 2 1.5-1.2 3.5-2 6-2h3V4h-3c-2.5 0-4.5.8-6 2z"/><path d="M12 6v14"/>',
    test: '<path d="M9 4h6a1 1 0 011 1v1H8V5a1 1 0 011-1z"/><path d="M8 6H6a1 1 0 00-1 1v13a1 1 0 001 1h12a1 1 0 001-1V7a1 1 0 00-1-1h-2"/><path d="m9 14 2 2 4-4"/>',
    course: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 000-7h-11a3.5 3.5 0 010-7H15"/><circle cx="18" cy="5" r="3"/>',
    records: '<path d="M4 20V10M12 20V4M20 20v-7"/>',
    settings: '<path d="M4 6h8m4 0h4M4 12h2m4 0h10M4 18h10m4 0h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>'
  };
  const items = [['home', 'ホーム'], ['study', '学習'], ['learn', '覚える'], ['test', 'テスト'], ['course', 'コース'], ['records', '記録'], ['settings', '設定']];
  $('#nav').innerHTML = items.map(([id, t]) =>
    `<button data-tab="${id}" aria-label="${t}" class="flex items-center gap-3 px-2.5 sm:px-3 py-2.5 rounded-xl text-sm font-medium ${id === 'settings' ? 'mt-auto' : ''} ${tab === id ? 'nav-active' : 'text-slate-600 nav-hover'}" ${tab === id ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[id]}</svg><span class="hidden sm:inline">${t}</span></button>`).join('');
}
$('#nav').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (!t) return;
  const inCourse = course && !course.finished, busy = (quiz && !quiz.done) || (test && !test.done) || inCourse;
  if (busy && !confirm(inCourse ? 'コースを中断しますか?(ここまでの回答は記録されます)' : test && !test.done ? 'テストを中断しますか?(結果は保存されません)' : '学習を中断しますか?(ここまでの回答は記録されます)')) return;
  stopTest(); quiz = null; test = null; rec.view = 'main'; rec.sel = null; endAlong(); endWatch(); course = null; cc.view = 'list'; tab = t.dataset.tab; render();
});

function render() {
  renderNav();
  if (tab === 'home') renderHome();
  else if (tab === 'study') quiz ? (quiz.done ? renderResult() : renderQuiz()) : renderSetup();
  else if (tab === 'course') renderCourse();
  else if (tab === 'learn') renderLearn();
  else if (tab === 'test') test ? (test.done ? renderTestResult() : renderTestRun()) : renderTestSetup();
  else if (tab === 'settings') renderSettings();
  else renderRecords();
}

/* ---- test ---- */

async function exportData() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `kuku-backup-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
  const json = JSON.stringify({ app: 'kuku', version: 1, exportedAt: d.toISOString(), log: db.log, sessions: db.sessions, tests: db.tests, alongs: db.alongs, courses: db.courses, myCourses: db.myCourses, watches: db.watches }, null, 1);
  const T = window.__TAURI__;
  if (T && T.dialog && T.fs) {
    // デスクトップアプリ版: 保存ダイアログで保存先を選ぶ
    try {
      const path = await T.dialog.save({ defaultPath: name, filters: [{ name: 'JSON', extensions: ['json'] }] });
      if (!path) return;
      await T.fs.writeTextFile(path, json);
      setg.msg = { ok: true, text: 'バックアップを保存しました。' };
    } catch (e) { setg.msg = { ok: false, text: 'バックアップを保存できませんでした。' }; }
    return renderSettings();
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  setg.msg = { ok: true, text: 'バックアップを保存しました。' }; renderSettings();
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if (!j || j.app !== 'kuku' || !Array.isArray(j.log)) throw new Error('format');
      const int9 = v => Number.isInteger(v) && v >= 1 && v <= 9;
      const log = j.log.filter(x => x && int9(x.a) && int9(x.b) && Number.isFinite(x.t))
        .map(x => ({ t: x.t, a: x.a, b: x.b, ok: !!x.ok, ms: Math.min(Math.max(+x.ms || 0, 0), 60000), sp: Math.max(+x.sp || 0, 0), along: x.along ? 1 : undefined }));
      const ses = (Array.isArray(j.sessions) ? j.sessions : []).filter(x => x && Number.isFinite(x.t) && MODES[x.mode])
        .map(x => ({ t: x.t, mode: x.mode, n: +x.n || 0, ok: +x.ok || 0, sp: +x.sp || 0, res: cleanSRes(x.res) }));
      const cleanRes = a => { if (!Array.isArray(a)) return undefined; const o = a.filter(r => Array.isArray(r) && int9(r[0]) && int9(r[1])).map(r => [r[0], r[1], r[2] ? 1 : 0, Math.min(Math.max(+r[3] || 0, 0), 60000), Number.isFinite(r[4]) ? r[4] : null, r[5] ? 1 : 0]); return o.length ? o : undefined; };
      const tst = (Array.isArray(j.tests) ? j.tests : []).filter(x => x && Number.isFinite(x.t) && Number.isFinite(x.score) && Array.isArray(x.dans))
        .map(x => ({ t: x.t, n: +x.n || 0, ok: +x.ok || 0, score: Math.min(Math.max(Math.round(x.score), 0), 100), dans: x.dans.filter(int9), limit: [3, 5, 10].includes(+x.limit) ? +x.limit : 0, rand: x.rand !== false, course: x.course === 'dan' || x.course === 'my' ? x.course : undefined, pass: x.pass == null ? undefined : !!x.pass, allowed: Number.isFinite(x.allowed) ? Math.max(0, Math.round(x.allowed)) : undefined, mult: Number.isFinite(x.mult) ? x.mult : undefined, res: cleanRes(x.res) })).filter(x => x.dans.length);
      const alg = cleanAlongs(j.alongs), crs = cleanCourses(j.courses), myc = cleanMyCourses(j.myCourses), wat = cleanWatches(j.watches);
      if (setg.imode === 'replace') {
        if (!confirm('いまの記録をバックアップの内容で置き換えます。よろしいですか?')) return;
        db.log = log; db.sessions = ses; db.tests = tst; db.alongs = alg; db.courses = crs; db.myCourses = myc; db.watches = wat;
        setg.msg = { ok: true, text: `置き換えました(回答記録 ${log.length}件 / 学習履歴 ${ses.length}件 / テスト ${tst.length}件 / やりながら ${alg.length}件 / コース ${crs.length}件 / マイコース ${myc.length}件 / 見ながら ${wat.length}件)。` };
      } else {
        const k1 = x => x.t + ':' + x.a + 'x' + x.b, k2 = x => x.t + ':' + x.mode;
        const s1 = new Set(db.log.map(k1)), s2 = new Set(db.sessions.map(k2)); let n1 = 0, n2 = 0, n3 = 0, n4 = 0, n5 = 0, n6 = 0, n7 = 0;
        log.forEach(x => { if (!s1.has(k1(x))) { s1.add(k1(x)); db.log.push(x); n1++; } });
        ses.forEach(x => { if (!s2.has(k2(x))) { s2.add(k2(x)); db.sessions.push(x); n2++; } });
        db.log.sort((x, y) => x.t - y.t); db.sessions.sort((x, y) => x.t - y.t);
        const s3 = new Set(db.tests.map(x => x.t));
        tst.forEach(x => { if (!s3.has(x.t)) { s3.add(x.t); db.tests.push(x); n3++; } });
        db.tests.sort((x, y) => x.t - y.t);
        const s4 = new Set(db.alongs.map(x => x.t));
        alg.forEach(x => { if (!s4.has(x.t)) { s4.add(x.t); db.alongs.push(x); n4++; } });
        db.alongs.sort((x, y) => x.t - y.t);
        const s5 = new Set(db.courses.map(x => x.t));
        crs.forEach(x => { if (!s5.has(x.t)) { s5.add(x.t); db.courses.push(x); n5++; } });
        db.courses.sort((x, y) => x.t - y.t);
        const s6 = new Set(db.myCourses.map(x => x.id));
        myc.forEach(x => { if (!s6.has(x.id)) { s6.add(x.id); db.myCourses.push(x); n6++; } });
        const s7 = new Set(db.watches.map(x => x.t));
        wat.forEach(x => { if (!s7.has(x.t)) { s7.add(x.t); db.watches.push(x); n7++; } });
        db.watches.sort((x, y) => x.t - y.t);
        setg.msg = { ok: true, text: `追加しました(回答記録 ${n1}件 / 学習履歴 ${n2}件 / テスト ${n3}件 / やりながら ${n4}件 / コース ${n5}件 / マイコース ${n6}件 / 見ながら ${n7}件)。` };
      }
      save();
    } catch (e) { setg.msg = { ok: false, text: 'このファイルは読み込めませんでした。九九れんしゅうのバックアップファイルを選んでください。' }; }
    renderSettings();
  };
  fr.readAsText(file);
}

$('#app').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.go) { cfg.mode = d.go; tab = 'study'; render(); return; }
  if (tab === 'course' && courseClick(t, d)) return;
  if (d.gotab) { tab = d.gotab; render(); return; }
  if (d.learn) { learn.sub = d.learn; tab = 'learn'; render(); return; }
  if (tab === 'study' && !quiz) {
    if (d.mode) { cfg.mode = d.mode; renderSetup(); }
    else if (d.dan) { const n = +d.dan; cfg.dans.has(n) ? cfg.dans.delete(n) : cfg.dans.add(n); renderSetup(); }
    else if (t.id === 'allDan') { cfg.dans = new Set([1,2,3,4,5,6,7,8,9]); renderSetup(); }
    else if (t.id === 'noDan') { cfg.dans.clear(); renderSetup(); }
    else if (d.diff) { cfg.diff = d.diff; renderSetup(); }
    else if (d.count) { cfg.count = d.count === 'all' ? 'all' : +d.count; renderSetup(); }
    else if (t.id === 'start') startQuiz();
  } else if (quiz && !quiz.done) {
    if (d.pad !== undefined) press(d.pad);
    else if (t.id === 'quit') { if (confirm('学習を中断しますか?(ここまでの回答は記録されます)')) finish(true); }
    else if (t.id === 'next') nextQ();
  } else if (quiz && quiz.done) {
    if (t.id === 'again') startQuiz(); else if (t.id === 'home') { quiz = null; render(); }
  } else if (tab === 'records') {
    if (d.rlist) { rec.kind = d.rlist; rec.filter = 'all'; rec.kind2 = 'all'; rec.view = 'list'; renderRecords(); try { window.scrollTo(0, 0); } catch (e) {} }
    else if (t.id === 'recBack') { rec.view = rec.view === 'detail' ? 'list' : 'main'; renderRecords(); try { window.scrollTo(0, 0); } catch (e) {} }
    else if (d.rsel !== undefined) { rec.sel = +d.rsel; rec.view = 'detail'; renderRecords(); try { window.scrollTo(0, 0); } catch (e) {} }
    else if (d.rfilter) { rec.filter = d.rfilter; renderRecords(); }
    else if (d.rkind) { rec.kind2 = d.rkind; renderRecords(); }
    else if (d.period) { sp.period = d.period; sp.off = 0; renderRecords(); }
    else if (d.off) { sp.off += +d.off; if (sp.off > 0) sp.off = 0; renderRecords(); }
    else if (t.id === 'reset') { if (confirm('すべての学習記録を削除します。よろしいですか?')) { db = { log: [], sessions: [], tests: [], alongs: [], courses: [], myCourses: db.myCourses, watches: [], ui: db.ui }; save(); renderRecords(); } }
  } else if (tab === 'learn') {
    if (d.lsub) { learn.sub = d.lsub; renderLearn(); }
    else if (d.lord) { learn.order = d.lord; renderLearn(); }
    else if (t.id === 'wstart') startWatch();
    else if (d.wpad !== undefined) wpress(d.wpad);
    else if (t.id === 'wquit' || t.id === 'whome') { endWatch(); renderLearn(); }
    else if (t.id === 'wagain') startWatch();
    else if (t.id === 'wtry') { cfg.dans = new Set(learn.dans); cfg.mode = 'asc'; endWatch(); tab = 'study'; render(); }
    else if (t.id === 'astart') startAlong();
    else if (d.apad !== undefined) apress(d.apad);
    else if (t.id === 'aquit' || t.id === 'ahome') { endAlong(); renderLearn(); }
    else if (t.id === 'aagain') startAlong();
    else if (t.id === 'atry') { cfg.dans = new Set(learn.dans); cfg.mode = 'asc'; endAlong(); tab = 'study'; render(); }
    else if (d.furi !== undefined) { db.ui.furi = !db.ui.furi; save(); renderLearn(); }
    else if (d.ldan) { const n = +d.ldan; learn.dans.has(n) ? learn.dans.delete(n) : learn.dans.add(n); renderLearn(); }
    else if (d.cell) { const [a, b] = d.cell.split(',').map(Number); learn.sel = learn.sel && learn.sel[0] === a && learn.sel[1] === b ? null : [a, b]; renderLearn(); }
  } else if (tab === 'test') {
    if (!test) {
      if (d.tdan) { const n = +d.tdan; tcfg.dans.has(n) ? tcfg.dans.delete(n) : tcfg.dans.add(n); renderTestSetup(); }
      else if (t.id === 'tall') { tcfg.dans = new Set(NUM9); renderTestSetup(); }
      else if (t.id === 'tnone') { tcfg.dans.clear(); renderTestSetup(); }
      else if (d.tcount) { tcfg.count = d.tcount === 'all' ? 'all' : +d.tcount; renderTestSetup(); }
      else if (d.tlimit) { tcfg.limit = +d.tlimit; renderTestSetup(); }
      else if (d.trand !== undefined) { tcfg.random = !tcfg.random; renderTestSetup(); }
      else if (t.id === 'tstart') startTest();
    } else if (!test.done) {
      if (d.tpad !== undefined) tpress(d.tpad);
      else if (t.id === 'tquit') { if (confirm('テストを中断しますか?(結果は保存されません)')) { stopTest(); test = null; render(); } }
    } else {
      if (t.id === 'tagain') startTest();
      else if (t.id === 'thome') { test = null; render(); }
      else if (t.id === 'treview') { learn.dans = new Set(test.wrongDans); learn.sub = 'memo'; test = null; tab = 'learn'; render(); }
    }
  } else if (tab === 'settings') {
    if (d.theme) { db.ui.theme = d.theme; save(); applyTheme(); renderSettings(); }
    else if (d.imode) { setg.imode = d.imode; renderSettings(); }
    else if (d.goal) setGoal(+d.goal);
    else if (d.goalstep) setGoal(goal() + +d.goalstep);
    else if (t.id === 'export') exportData();
  }
});

/* ---- quiz ---- */
function startQuiz(c = cfg) {
  const qs = buildQuestions(c); if (!qs.length) return;
  quiz = { qs, i: 0, input: '', locked: false, t0: Date.now(), res: [], done: false, mode: c.mode, limit: c.limit || 0, timer: null, ltimer: null };
  render();
}
function renderQuiz() {
  const q = quiz.qs[quiz.i], pct = quiz.i / quiz.qs.length * 100;
  const pad = [1,2,3,4,5,6,7,8,9].map(n => `<button data-pad="${n}" class="glass-btn rounded-xl py-4 text-xl font-bold tabular-nums">${n}</button>`).join('')
    + `<button data-pad="bs" aria-label="ひとつ消す" class="glass-btn rounded-xl py-4 flex justify-center items-center text-slate-600">${ICON.back}</button>`
    + `<button data-pad="0" class="glass-btn rounded-xl py-4 text-xl font-bold">0</button>`
    + `<button data-pad="ok" class="rounded-lg py-4 font-bold btn-accent text-white">決定</button>`;
  $('#app').innerHTML = `
  <section class="max-w-sm mx-auto glass p-5">
    <div class="flex items-center justify-between text-sm text-slate-500 mb-2">
      <span class="tabular-nums">${quiz.i + 1} / ${quiz.qs.length}</span>
      <span>${MODES[quiz.mode]}</span>
      <button id="quit" class="text-slate-500 hover:opacity-70 underline">やめる</button>
    </div>
    <div class="h-1.5 track rounded-full overflow-hidden ${quiz.limit ? 'mb-2' : 'mb-8'}"><div class="h-full bar-h transition-all" style="width:${pct}%"></div></div>
    ${quiz.limit ? '<div class="h-1.5 track rounded-full overflow-hidden mb-6" role="img" aria-label="のこり時間"><div id="qbar" class="h-full bar-h" style="width:100%"></div></div>' : ''}
    <p class="text-center text-5xl sm:text-6xl font-bold tabular-nums mb-6">${q.a} × ${q.b}</p>
    <div id="ans" class="ans rounded-xl h-16 flex items-center justify-center text-3xl font-bold tabular-nums mb-3"></div>
    <div id="fb" class="h-12 flex items-center justify-center mb-2" aria-live="polite"></div>
    <div class="grid grid-cols-3 gap-2">${pad}</div>
  </section>`;
  if (tab === 'course' && course) $('#app').insertAdjacentHTML('afterbegin', courseBanner());
  showInput();
  quiz.t0 = Date.now();
  const bar = $('#qbar');
  if (bar) {
    const qq = quiz;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${qq.limit}s linear`; bar.style.width = '0%'; }));
    qq.ltimer = setTimeout(() => { if (quiz === qq && !qq.done) submit(true); }, qq.limit * 1000);
  }
}
function showInput() {
  const el = $('#ans'); if (!el) return;
  el.innerHTML = quiz.input || '<span class="text-slate-300">答えを入力</span>';
}
function press(k) {
  if (quiz.locked) { if (k === 'ok') nextQ(); return; }
  if (k === 'bs') quiz.input = quiz.input.slice(0, -1);
  else if (k === 'ok') return submit();
  else if (quiz.input.length < 2) quiz.input = (quiz.input === '0' ? '' : quiz.input) + k;
  showInput();
}
function submit(timeout) {
  if (quiz.locked || (!timeout && !quiz.input)) return;
  clearTimeout(quiz.ltimer);
  const q = quiz.qs[quiz.i], ms = Date.now() - quiz.t0, ans = quiz.input ? +quiz.input : null, ok = !timeout && ans === q.a * q.b;
  const pts = ok ? 10 + (ms < 3000 ? 5 : 0) : 0;
  const rec = { t: Date.now(), a: q.a, b: q.b, ok, ms: Math.min(ms, 60000), sp: pts };
  db.log.push(rec); save(); quiz.res.push({ ...rec, ans }); quiz.locked = true;
  const fb = $('#fb'), box = $('#ans');
  if (ok) {
    box.classList.add('ans-ok');
    fb.innerHTML = `<span class="text-acc font-bold text-lg">${ICON.ok} Great!</span><span class="ml-3 text-sm text-slate-500 tabular-nums">+${pts} SP</span>`;
    quiz.timer = setTimeout(nextQ, 800);
  } else {
    box.classList.add('ans-ng');
    fb.innerHTML = `<span class="text-slate-700 font-bold">${ICON.ng} ${timeout ? '時間切れ ' : ''}正解は <span class="text-xl tabular-nums">${q.a * q.b}</span></span><button id="next" class="ml-4 px-4 py-1.5 rounded-lg glass-btn text-sm">つぎへ</button>`;
  }
}
function nextQ() {
  clearTimeout(quiz.timer); clearTimeout(quiz.ltimer);
  if (!quiz.locked) return;
  quiz.i++; quiz.input = ''; quiz.locked = false;
  quiz.i >= quiz.qs.length ? finish(false) : renderQuiz();
}
function finish(aborted) {
  clearTimeout(quiz.timer); clearTimeout(quiz.ltimer);
  if (aborted && !quiz.res.length) { quiz = null; return render(); }
  const r = quiz.res, ok = r.filter(x => x.ok).length;
  quiz.sum = { t: Date.now(), mode: quiz.mode, n: r.length, ok, sp: r.reduce((s, x) => s + x.sp, 0), res: r.map(x => [x.a, x.b, x.ok ? 1 : 0, x.ms, x.ans, x.sp]) };
  db.sessions.push(quiz.sum); save(); quiz.done = true; if (!aborted && course && tab === 'course') courseQuizDone(); render();
}
function renderResult() {
  const s = quiz.sum, r = quiz.res, perfect = s.ok === s.n;
  const avg = (r.reduce((a, x) => a + x.ms, 0) / r.length / 1000).toFixed(1);
  const wrong = r.filter(x => !x.ok);
  $('#app').innerHTML = `
  <section class="max-w-sm mx-auto text-center glass p-6">
    <h2 class="text-3xl font-bold mb-1">${perfect ? 'Congratulations!' : 'Good job!'}</h2>

    <dl class="grid grid-cols-3 gap-3 mb-8">
      <div class="glass py-3"><dd class="text-2xl font-bold tabular-nums">${Math.round(s.ok / s.n * 100)}%</dd><dt class="text-xs text-slate-500">正答率</dt></div>
      <div class="glass py-3"><dd class="text-2xl font-bold tabular-nums">${avg}秒</dd><dt class="text-xs text-slate-500">平均時間</dt></div>
      <div class="glass py-3"><dd class="text-2xl font-bold tabular-nums text-acc">+${s.sp}</dd><dt class="text-xs text-slate-500">SP</dt></div>

    ${wrong.length ? `<div class="text-left mb-8"><p class="text-sm text-slate-500 mb-2">まちがえた問題</p><div class="flex flex-wrap gap-2">${wrong.map(x => `<span class="px-2.5 py-1 rounded-md glass-chip text-sm tabular-nums">${x.a} × ${x.b} = ${x.a * x.b}</span>`).join('')}</div></div>` : ''}
    <div class="flex gap-2 justify-center">

}
document.addEventListener('keydown', e => {
  if (tab === 'course' && course && course.phase === 'between' && e.key === 'Enter') { e.preventDefault(); courseClick({ id: 'cnext' }, {}); return; }
  const inQuiz = (tab === 'study' || tab === 'course') && quiz && !quiz.done, inTest = (tab === 'test' || tab === 'course') && test && !test.done, inAlong = (tab === 'learn' || tab === 'course') && learn.run && !learn.run.done, inWatch = (tab === 'learn' || tab === 'course') && learn.watch && !learn.watch.done;
  if (!inQuiz && !inTest && !inAlong && !inWatch) return;

/* ---- test records ---- */
const shortDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
const backBtn = `<button id="recBack" class="glass-btn rounded-lg px-3 py-2 text-sm font-medium inline-flex items-center gap-1">${ICON.prev}もどる</button>`;
function trendChart(L, val = x => x.score, passLine = true, unit = '点') {
  if (!L.length) return '';
  const W = 600, H = 200, pl = 34, pr = 12, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
  const X = i => pl + (L.length === 1 ? iw / 2 : i / (L.length - 1) * iw), Y = v => pt + (1 - v / 100) * ih;
  const grid = [0, 50, 100].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--mute)">${v}</text>`).join('');
  const pass = !passLine ? '' : `<line x1="${pl}" x2="${W - pr}" y1="${Y(90)}" y2="${Y(90)}" stroke-dasharray="4 4" style="stroke:var(--mute)"/><text x="${W - pr}" y="${Y(90) - 4}" text-anchor="end" font-size="10" style="fill:var(--mute)">合格 90</text>`;
  const pts = L.map((x, i) => `${X(i).toFixed(1)},${Y(val(x)).toFixed(1)}`).join(' ');
  const dots = L.map((x, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(val(x)).toFixed(1)}" r="4" style="fill:var(--acc-text)"><title>${shortDate(x.t)} ${val(x)}${unit}</title></circle>`).join('');
  const lab = `<text x="${pl}" y="${H - 6}" font-size="11" style="fill:var(--mute)">${shortDate(L[0].t)}</text>` + (L.length > 1 ? `<text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" style="fill:var(--mute)">${shortDate(L[L.length - 1].t)}</text>` : '');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="テスト点数の推移">${grid}${pass}<polyline points="${pts}" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:var(--acc-text)"/>${dots}${lab}</svg>`;
}
function renderTestList() {

  const best = n ? Math.max(...L.map(x => x.score)) : 0, avg = n ? Math.round(L.reduce((s, x) => s + x.score, 0) / n) : 0, passed = L.filter(x => isPass(x)).length;

  L.forEach(x => (x.res || []).forEach(r => { const k = r[0] + 'x' + r[1]; const m = miss[k] = miss[k] || { a: r[0], b: r[1], w: 0, n: 0 }; m.n++; if (!r[2]) m.w++; }));
  const worst = Object.values(miss).filter(m => m.w).sort((x, y) => y.w / y.n - x.w / x.n || y.w - x.w).slice(0, 6);
  $('#app').innerHTML = `
  <section class="space-y-4">
    <div class="flex items-center gap-3">${backBtn}<h2 class="text-2xl font-bold">テスト記録</h2></div>
    ${n ? `<dl class="grid grid-cols-2 sm:grid-cols-4 gap-3">${card(n + '回', '受けた回数')}${card(best + '点', '最高点')}${card(avg + '点', '平均点')}${card(passed + '回', '合格')}</dl>
    <div class="glass p-5"><h3 class="font-bold mb-3">点数の推移<span class="text-xs font-normal rd ml-2">最近${Math.min(n, 20)}回</span></h3>${trendChart(L.slice(-20), x => x.score, false)}</div>
    <div class="glass p-5"><h3 class="font-bold mb-1">テスト一覧</h3><p class="text-sm rd mb-2">押すと、1問ごとの結果を見られます。</p>
      <ul class="divide-soft">${L.map((x, i) => [x, i]).reverse().map(([x, i]) => `<li><button data-rsel="${i}" class="w-full flex items-center gap-2 py-3 px-1 text-sm text-left nav-hover rounded-lg"><span class="rd tabular-nums w-24 shrink-0">${fmtDate(x.t)}</span><span class="flex-1 min-w-0 truncate">${rangeLabel(x.dans, x.limit, x.rand, x.course)}</span><span class="tabular-nums rd w-16 text-right">${x.ok}/${x.n}問</span><span class="tabular-nums font-bold w-12 text-right">${x.score}点</span><span class="w-10 text-right text-xs ${isPass(x) ? 'text-acc font-bold' : 'rd'}">${isPass(x) ? '合格' : ''}</span><span class="rd">${ICON.next}</span></button></li>`).join('')}</ul></div>
    ${worst.length ? `<div class="glass p-5"><h3 class="font-bold mb-3">テストでよくまちがえる問題</h3><div class="flex flex-wrap gap-2">${worst.map(m => `<span class="px-3 py-1.5 rounded-lg glass-chip text-sm tabular-nums">${m.a} × ${m.b}<span class="rd ml-2 text-xs">${m.w}/${m.n}回</span></span>`).join('')}</div></div>` : ''}`
    : '<div class="glass p-8 text-center rd text-sm">まだテストを受けていません。「テスト」から受けると、ここに記録されます。</div>'}
  </section>`;
}
function renderTestDetail() {

  const rr = resOf('test', x), res = rr && rr.res, pass = isPass(x);
  const info = (l, v) => `<div class="flex justify-between gap-4 py-2 text-sm"><dt class="rd">${l}</dt><dd class="font-medium tabular-nums text-right">${v}</dd></div>`;

  else if (p === 'week') { const dow = (n.getDay() + 6) % 7; s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - dow + off * 7); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7); const l = new Date(e - 1); label = `${s.getMonth()+1}/${s.getDate()} 〜 ${l.getMonth()+1}/${l.getDate()}`; }
  else if (p === 'month') { s = new Date(n.getFullYear(), n.getMonth() + off, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 1); label = `${s.getFullYear()}年${s.getMonth()+1}月`; }
  else { s = new Date(n.getFullYear() + off, 0, 1); e = new Date(s.getFullYear() + 1, 0, 1); label = `${s.getFullYear()}年`; }
  return { s: +s, e: +e, label };
}
function pie(vals, total) {
  const R = 90, C = 100; let ang = -Math.PI / 2, out = '';
  const pt = a => [C + R * Math.cos(a), C + R * Math.sin(a)];
  vals.forEach((v, i) => {
    if (!v) return;
    if (v === total) { out += `<circle cx="${C}" cy="${C}" r="${R}" fill="${COLORS[i]}"/>`; return; }
    const a2 = ang + v / total * Math.PI * 2, [x1, y1] = pt(ang), [x2, y2] = pt(a2);
    out += `<path d="M${C} ${C}L${x1} ${y1}A${R} ${R} 0 ${a2 - ang > Math.PI ? 1 : 0} 1 ${x2} ${y2}Z" fill="${COLORS[i]}" style="stroke:var(--hole)" stroke-width="1.5"/>`;
    ang = a2;
  });
  return `<svg viewBox="0 0 200 200" class="w-56 h-56 shrink-0" role="img" aria-label="段ごとのSP割合">${out}<circle cx="${C}" cy="${C}" r="52" style="fill:var(--hole)"/><text x="${C}" y="${C + 4}" text-anchor="middle" font-size="24" font-weight="700" style="fill:var(--fg)">${total}</text><text x="${C}" y="${C + 22}" text-anchor="middle" font-size="11" fill="#64748b">SP</text></svg>`;
}
function spHTML() {
  const r = range(sp.period, sp.off), vals = Array(9).fill(0);
  db.log.forEach(x => { if (x.t >= r.s && x.t < r.e) vals[x.a - 1] += x.sp; });
  const total = vals.reduce((a, b) => a + b, 0);
  const P = { day: '日', week: '週', month: '月', year: '年' };
  return `
  <div>
    <div class="glass inline-flex overflow-hidden p-1 gap-1 mb-5" role="tablist">
      ${Object.entries(P).map(([k, v]) => `<button data-period="${k}" role="tab" aria-selected="${sp.period === k}" class="px-5 py-2 rounded-lg text-sm font-medium ${sp.period === k ? 'btn-accent text-white' : 'text-slate-700 nav-hover'}">${v}</button>`).join('')}
    </div>
    <div class="flex items-center gap-2 mb-6">
      <button data-off="-1" aria-label="前へ" class="p-1.5 rounded-lg glass-btn">${ICON.prev}</button>
      <span class="font-bold tabular-nums min-w-[10rem] text-center">${r.label}</span>
      <button data-off="1" aria-label="次へ" class="p-1.5 rounded-lg glass-btn disabled:opacity-30" ${sp.off >= 0 ? 'disabled' : ''}>${ICON.next}</button>
    </div>
    ${total ? `<div class="flex flex-col sm:flex-row items-center gap-8">
      ${pie(vals, total)}
      <ul class="w-full text-sm">${vals.map((v, i) => `<li class="flex items-center gap-3 py-1.5 ${v ? '' : 'text-slate-400'}"><i class="w-3 h-3 rounded-sm shrink-0 border border-black/5" style="background:${COLORS[i]}"></i><span class="w-14">${i + 1}の段</span><span class="flex-1 text-right tabular-nums">${v} SP</span><span class="w-12 text-right tabular-nums">${Math.round(v / total * 100)}%</span></li>`).join('')}</ul>
    </div>` : `<p class="text-slate-500 py-12 text-center glass">この期間の SP はまだありません。<br>「学習」で問題に正解すると SP がたまります。</p>`}
    <p class="text-xs text-slate-500 mt-6">SP: 正解1問につき 10 SP。3秒以内に答えると +5 SP。</p>
  </div>`;
}

db.courses = cleanCourses(db.courses); db.myCourses = cleanMyCourses(db.myCourses);
render();
})();
